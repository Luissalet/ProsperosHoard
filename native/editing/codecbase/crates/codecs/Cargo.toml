[package]
name = "lumiere-codecbase-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumiere-codecbase-time = { workspace = true }
lumiere-codecbase-color = { workspace = true }
lumiere-codecbase-frame = { workspace = true }
lumiere-codecbase-media = { workspace = true }
lumiere-codecbase-isobmff = { workspace = true }
lumiere-codecbase-matroska = { workspace = true }
lumiere-codecbase-mxf = { workspace = true }
lumiere-codecbase-mpegts = { workspace = true }
lumiere-codecbase-mpeg2v = { workspace = true }
lumiere-codecbase-ac3 = { workspace = true }
lumiere-codecbase-ogg = { workspace = true }
lumiere-codecbase-bitstream = { workspace = true }
lumiere-codecbase-h264 = { workspace = true }
lumiere-codecbase-hevc = { workspace = true }
lumiere-codecbase-vp9 = { workspace = true }
lumiere-codecbase-prores = { workspace = true }
lumiere-codecbase-dnx = { workspace = true }
lumiere-codecbase-av1 = { workspace = true }
lumiere-codecbase-aac = { workspace = true }
lumiere-codecbase-opus = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
lumiere-codecbase-testkit = { workspace = true }
