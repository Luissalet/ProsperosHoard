[package]
name = "lumiere-codecbase-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
lumiere-codecbase-testkit = { workspace = true }
lumiere-codecbase-color = { workspace = true }
lumiere-codecbase-frame = { workspace = true }
lumiere-codecbase-time = { workspace = true }
lumiere-codecbase-geom = { workspace = true }
lumiere-codecbase-media = { workspace = true }
lumiere-codecbase-project = { workspace = true }
lumiere-codecbase-render = { workspace = true }
lumiere-codecbase-gpu = { workspace = true }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
