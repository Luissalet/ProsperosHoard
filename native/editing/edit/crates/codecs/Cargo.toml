[package]
name = "lumiere-edit-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumiere-edit-time = { workspace = true }
lumiere-edit-color = { workspace = true }
lumiere-edit-frame = { workspace = true }
lumiere-edit-media = { workspace = true }
lumiere-edit-isobmff = { workspace = true }
lumiere-edit-matroska = { workspace = true }
lumiere-edit-mxf = { workspace = true }
lumiere-edit-mpegts = { workspace = true }
lumiere-edit-mpeg2v = { workspace = true }
lumiere-edit-ac3 = { workspace = true }
lumiere-edit-ogg = { workspace = true }
lumiere-edit-bitstream = { workspace = true }
lumiere-edit-h264 = { workspace = true }
lumiere-edit-hevc = { workspace = true }
lumiere-edit-vp9 = { workspace = true }
lumiere-edit-prores = { workspace = true }
lumiere-edit-dnx = { workspace = true }
lumiere-edit-av1 = { workspace = true }
lumiere-edit-aac = { workspace = true }
lumiere-edit-opus = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
lumiere-edit-testkit = { workspace = true }
