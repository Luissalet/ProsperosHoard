[package]
name = "lumiere-edit-dnx"
description = "Clean-room Avid DNxHD / DNxHR (SMPTE ST 2019-1 VC-3) decoder and encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
lumiere-edit-bitstream = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
lumiere-edit-testkit = { workspace = true }
