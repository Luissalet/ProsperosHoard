[package]
name = "lumiere-edit-render"
description = "Sequence evaluation and CPU reference compositor (linear-light premultiplied f32)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumiere-edit-time = { workspace = true }
lumiere-edit-geom = { workspace = true }
lumiere-edit-color = { workspace = true }
lumiere-edit-frame = { workspace = true }
lumiere-edit-media = { workspace = true }
lumiere-edit-project = { workspace = true }
lumiere-edit-audio-dsp = { workspace = true }
lumiere-edit-captions = { workspace = true }
lumiere-edit-text = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
