[package]
name = "lumiere-motion-gpu"
description = "The GPU compositor (wgpu compute): layer transforms, masks/mattes, the 38 blend modes, motion blur, bit-depth quantisation and GPU effects, with the CPU renderer as the reference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumiere-motion-time = { workspace = true }
lumiere-motion-geom = { workspace = true }
lumiere-motion-color = { workspace = true }
lumiere-motion-project = { workspace = true }
lumiere-motion-raster = { workspace = true }
lumiere-motion-effects = { workspace = true }
lumiere-motion-render = { workspace = true }
lumiere-motion-keyframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

[dev-dependencies]
lumiere-motion-text = { workspace = true }
