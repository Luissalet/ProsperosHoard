[package]
name = "lumiere-motion-host"
description = "Builds a fully wired Lumiere Motion session: media decoding (Lumiere Edit codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
lumiere-motion-engine = { workspace = true }
lumiere-motion-project = { workspace = true }
lumiere-motion-media = { workspace = true }
lumiere-motion-expr = { workspace = true }
lumiere-motion-script = { workspace = true }
lumiere-motion-export = { workspace = true }
lumiere-motion-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lumiere-motion-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
lumiere-motion-psd = { workspace = true }
lumiere-motion-svg = { workspace = true }
lumiere-motion-pdf = { workspace = true }
lumiere-motion-raster = { workspace = true }
lumiere-motion-time = { workspace = true }
lumiere-motion-interchange = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
