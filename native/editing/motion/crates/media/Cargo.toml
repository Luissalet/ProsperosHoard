lumiere-motion-render = { workspace = true }
lumiere-motion-psd = { workspace = true }
lumiere-motion-svg = { workspace = true }
lumiere-motion-pdf = { workspace = true }
lumiere-motion-model = { workspace = true }
lumiere-codecbase-codecs = { workspace = true }
lumiere-codecbase-media = { workspace = true }
lumiere-codecbase-frame = { workspace = true }
lumiere-codecbase-color = { workspace = true }
lumiere-codecbase-time = { workspace = true }
exr = { workspace = true }
image = { workspace = true, features = ["gif", "webp", "tiff", "bmp", "exr"] }
rayon = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
