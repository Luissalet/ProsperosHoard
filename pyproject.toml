[project]
name = "prosperos-hoard"
version = "0.1.0"
description = "Prospero's Hoard - a media studio an agent can direct"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "pillow==11.1.0",
    "numpy==2.2.1",
    "scipy==1.14.1",
    "mcp==1.9.4",
    "imageio-ffmpeg==0.5.1",
    "piper-tts==1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[project.urls]
Repository = "https://github.com/Luissalet/ProsperosHoard"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prosperos_hoard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
